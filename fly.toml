# Fly.io — დეპლოი: fly launch --copy-config && fly volumes create anonimo_data --size 1 && fly deploy
app = "anonimo"
primary_region = "fra"

[env]
  PORT = "3000"
  DB_PATH = "/data/data.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "anonimo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
